name: Publish iOS test install page

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir release-assets
          mv release-assets/*.ipa release-assets/Foodcart.ipa
      - name: Generate HTTPS install page
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BUILD_NUMBER: ${{ github.event.release.tag_name }}
        run: |
          BUNDLE_ID=com.foodcart.localdemo VERSION=0.1.0 BUILD_NUMBER="$BUILD_NUMBER" \
            ./scripts/generate-ios-ota-site.sh release-assets/Foodcart.ipa "$PAGES_URL" site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
